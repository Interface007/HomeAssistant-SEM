             | select('match', 'binary_sensor\.')
             | select('search', '_window_.*_contact$')
           ) | selectattr('state', 'eq', 'on') | list | count > 0 }}

    # No window contact installed yet - stays "off" until one is added to
    # the living_room area (then reload templates once).
    - name: "Living Room Window Open"
      unique_id: living_room_window_open
      default_entity_id: binary_sensor.living_room_window_open
      device_class: window
      state: >
        {{ expand(
