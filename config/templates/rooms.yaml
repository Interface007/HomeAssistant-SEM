      state: >
        {% from 'climate.jinja' import dew_point %}
        {{ dew_point(states('sensor.storage_room_temperature') | float,
                     states('sensor.storage_room_humidity') | float) | float | round(1) }}

    - name: "Storage Room Wall Temperature"
      unique_id: storage_room_wall_temperature
      default_entity_id: sensor.storage_room_wall_temperature
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      availability: >
        {{ has_value('sensor.storage_room_temperature') and has_value('sensor.outdoor_temperature') }}
      state: >
        {% from 'climate.jinja' import wall_temp_estimate, f_rsi %}
        {{ wall_temp_estimate(states('sensor.outdoor_temperature') | float,
                              states('sensor.storage_room_temperature') | float,
                              f_rsi('storage_room') | float) | float | round(1) }}

    - name: "Storage Room Wall Surface Humidity"
      unique_id: storage_room_wall_surface_humidity
      default_entity_id: sensor.storage_room_wall_surface_humidity
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:water-percent-alert
      availability: >
        {{ has_value('sensor.storage_room_temperature')
           and has_value('sensor.storage_room_humidity')
           and has_value('sensor.storage_room_wall_temperature') }}
      state: >
        {% from 'climate.jinja' import wall_surface_rh %}
        {{ wall_surface_rh(states('sensor.storage_room_temperature') | float,
                           states('sensor.storage_room_humidity') | float,
                           states('sensor.storage_room_wall_temperature') | float) | float | round(1) }}

- binary_sensor:
    - name: "Storage Room Condensation Risk"
      unique_id: storage_room_condensation_risk
      default_entity_id: binary_sensor.storage_room_condensation_risk
      device_class: moisture
      availability: >
        {{ has_value('sensor.storage_room_wall_temperature') and has_value('sensor.storage_room_dew_point') }}
      state: >
        {{ states('sensor.storage_room_wall_temperature') | float
           <= states('sensor.storage_room_dew_point') | float }}

    - name: "Storage Room Mold Risk"
      unique_id: storage_room_mold_risk
      default_entity_id: binary_sensor.storage_room_mold_risk
      device_class: problem
      availability: "{{ has_value('sensor.storage_room_wall_surface_humidity_24h') }}"
      state: "{{ states('sensor.storage_room_wall_surface_humidity_24h') | float >= 80 }}"

    # Keller-Sonderlogik (Basis für spätere Ventilator-Automation):
    #  1. AH außen deutlich niedriger als innen (Hysterese wie oben)
    #  2. UND Taupunkt außen < Kellerwand-Temperatur - 2 K
    #     (sonst Sommer-Kondensation an kühlen Kellerwänden)
    - name: "Storage Room Ventilation Recommended"
      unique_id: storage_room_ventilation_recommended
      default_entity_id: binary_sensor.storage_room_ventilation_recommended
      icon: mdi:fan
      availability: >
        {{ has_value('sensor.storage_room_absolute_humidity')
           and has_value('sensor.outdoor_absolute_humidity')
           and has_value('sensor.outdoor_dew_point')
           and has_value('sensor.storage_room_wall_temperature') }}
      state: >
        {% set d = states('sensor.storage_room_absolute_humidity') | float
                 - states('sensor.outdoor_absolute_humidity') | float %}
        {% set drier = d > 0.3 if is_state(this.entity_id, 'on') else d > 0.7 %}
        {% set safe = states('sensor.outdoor_dew_point') | float
                    < states('sensor.storage_room_wall_temperature') | float - 2 %}
        {{ drier and safe }}

