# ------------------------- STORAGE ROOM (Keller) ----------------------
# Achtung: Kellerwände grenzen ans Erdreich -> f_Rsi-Schätzung über die
# Außentemperatur ist hier nur eine Näherung. Geplant: eigener Wandsensor.
- sensor:
    - name: "Storage Room Absolute Humidity"
      unique_id: storage_room_absolute_humidity
      default_entity_id: sensor.storage_room_absolute_humidity
      unit_of_measurement: "g/m³"
      state_class: measurement
      icon: mdi:water-outline
      availability: >
        {{ has_value('sensor.storage_room_temperature') and has_value('sensor.storage_room_humidity') }}
