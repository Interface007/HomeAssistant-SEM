
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml

# File-based automations, grouped by topic (visible in UI, but editable only
# via file; reload: Developer Tools -> YAML -> Automations)
automation manual: !include_dir_merge_list automations/
script: !include scripts.yaml
scene: !include scenes.yaml

# All template sensors are stored as files under templates/
# (outdoor.yaml, rooms.yaml, epaper.yaml)
template: !include_dir_merge_list templates/

# Classic platform sensors (statistics for 24h rolling averages)
sensor: !include sensors.yaml

rest_command: !include rest_commands.yaml

# YAML dashboard (file: /config/dashboards/matzen.yaml)
lovelace:
  mode: storage
  dashboards:
    matzen-home:
      mode: yaml
      title: Matzen
      icon: mdi:home-analytics
      show_in_sidebar: true
      filename: dashboards/matzen.yaml
    claudia-home:
      mode: yaml
      title: Claudia
      icon: mdi:account
      show_in_sidebar: true
      filename: dashboards/claudia.yaml
    lea-home:
      mode: yaml
      title: Lea
      icon: mdi:flower
      show_in_sidebar: true
      filename: dashboards/lea.yaml
    anna-home:
      mode: yaml
      title: Anna
      icon: mdi:account
      show_in_sidebar: true
      filename: dashboards/anna.yaml
    sven-home:
      mode: yaml
      title: Sven
      icon: mdi:account
      show_in_sidebar: true
      filename: dashboards/sven.yaml

input_boolean:
  trigger_forecast_update:
    name: Trigger Forecast Update
    icon: mdi:update

# Consumption history for the ePaper bar charts, as ";"-separated integers
# (oldest...newest, 14 values). Water in litres, power in Wh - see
# automations/consumption_history.yaml. No unit_of_measurement here: the
# content is a CSV string, not a measurement.
input_text:
  water_meter_history:
    name: "Water Meter History (14 Days)"
    icon: mdi:water
    max: 255
  power_history:
    name: "Power History (14 Days)"
    icon: mdi:flash
    max: 255

# Values last rendered onto ePaper Tag01. The automation compares the live
# sensors against these to decide whether a redraw is worth it
# (see automations/epaper_tag_1.yaml).
input_number:
  epaper_tag_1_outdoor_temperature:
    name: "Tag01 shown outdoor temperature"
    icon: mdi:thermometer
    min: -50
    max: 60
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
  epaper_tag_1_living_room_temperature:
    name: "Tag01 shown living room temperature"
    icon: mdi:thermometer
    min: -50
    max: 60
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
  epaper_tag_1_outdoor_humidity:
    name: "Tag01 shown outdoor humidity"
    icon: mdi:water-percent
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"
    mode: box
  epaper_tag_1_living_room_humidity:
    name: "Tag01 shown living room humidity"
    icon: mdi:water-percent
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"
    mode: box

# Consumption meters (source: AI-on-the-Edge water meter, Shelly 3EM)
utility_meter:
  water_daily:
    source: sensor.watermeter_value
    cycle: daily
  solar_daily:
    source: sensor.anker_solix_solar_energy_total
    cycle: daily
  water_monthly:
    source: sensor.watermeter_value
    cycle: monthly
  power_main_daily:
    source: sensor.power_main_energy
    cycle: daily
