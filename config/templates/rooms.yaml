# =====================================================================
# Room-climate calculations per room
#   living_room  -> sonoff_th_02 + measured wall temperature (ESP32)
#   bedroom      -> sonoff_th_01 (wall estimated via f_Rsi)
#   storage_room -> sonoff_th_04 (basement; wall estimated, special ventilation logic)
#
# Pattern for additional rooms: copy block, change entities + room name,
# add f_Rsi in custom_templates/climate.jinja.
# mold_risk uses the 24h average (statistics sensor in sensors.yaml).
# =====================================================================

# ------------------------- LIVING ROOM -------------------------------
- sensor:
    - name: "Living Room Absolute Humidity"
      unique_id: living_room_absolute_humidity
      default_entity_id: sensor.living_room_absolute_humidity
      unit_of_measurement: "g/m³"
      state_class: measurement
      icon: mdi:water-outline
      availability: >
        {{ has_value('sensor.living_room_temperature') and has_value('sensor.living_room_humidity') }}
      state: >
        {% from 'climate.jinja' import abs_humidity %}
        {{ abs_humidity(states('sensor.living_room_temperature') | float,
                        states('sensor.living_room_humidity') | float) | float | round(2) }}

    - name: "Living Room Dew Point"
      unique_id: living_room_dew_point
      default_entity_id: sensor.living_room_dew_point
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      availability: >
        {{ has_value('sensor.living_room_temperature') and has_value('sensor.living_room_humidity') }}
      state: >
        {% from 'climate.jinja' import dew_point %}
        {{ dew_point(states('sensor.living_room_temperature') | float,
                     states('sensor.living_room_humidity') | float) | float | round(1) }}

    # Measured wall temperature -> unified name according to convention
    - name: "Living Room Wall Temperature"
      unique_id: living_room_wall_temperature
      default_entity_id: sensor.living_room_wall_temperature
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      availability: "{{ has_value('sensor.esp32_walltemp_01_temperature') }}"
      state: "{{ states('sensor.esp32_walltemp_01_temperature') | float | round(1) }}"

    - name: "Living Room Wall Surface Humidity"
      unique_id: living_room_wall_surface_humidity
      default_entity_id: sensor.living_room_wall_surface_humidity
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:water-percent-alert
      availability: >
        {{ has_value('sensor.living_room_temperature')
           and has_value('sensor.living_room_humidity')
           and has_value('sensor.living_room_wall_temperature') }}
      state: >
        {% from 'climate.jinja' import wall_surface_rh %}
        {{ wall_surface_rh(states('sensor.living_room_temperature') | float,
                           states('sensor.living_room_humidity') | float,
                           states('sensor.living_room_wall_temperature') | float) | float | round(1) }}

    # Diagnostics: live-measured f_Rsi as reference for estimated rooms.
    # Valid only for ΔT >= 10 K (otherwise unavailable).
    - name: "Living Room f_Rsi Live"
      unique_id: living_room_f_rsi_live
      default_entity_id: sensor.living_room_f_rsi_live
      state_class: measurement
      icon: mdi:home-thermometer
      availability: >
        {{ has_value('sensor.living_room_temperature')
           and has_value('sensor.living_room_wall_temperature')
           and has_value('sensor.outdoor_temperature')
           and (states('sensor.living_room_temperature') | float(0)
                - states('sensor.outdoor_temperature') | float(0)) >= 10 }}
      state: >
        {% set t_in = states('sensor.living_room_temperature') | float %}
        {% set t_out = states('sensor.outdoor_temperature') | float %}
        {% set t_wall = states('sensor.living_room_wall_temperature') | float %}
        {{ ((t_wall - t_out) / (t_in - t_out)) | round(3) }}

- binary_sensor:
    - name: "Living Room Condensation Risk"
      unique_id: living_room_condensation_risk
      default_entity_id: binary_sensor.living_room_condensation_risk
      device_class: moisture
      availability: >
        {{ has_value('sensor.living_room_wall_temperature') and has_value('sensor.living_room_dew_point') }}
      state: >
        {{ states('sensor.living_room_wall_temperature') | float
           <= states('sensor.living_room_dew_point') | float }}

    - name: "Living Room Mold Risk"
      unique_id: living_room_mold_risk
      default_entity_id: binary_sensor.living_room_mold_risk
      device_class: problem
      availability: "{{ has_value('sensor.living_room_wall_surface_humidity_24h') }}"
      state: "{{ states('sensor.living_room_wall_surface_humidity_24h') | float >= 80 }}"

    # Ventilation useful? AH indoors - AH outdoors; hysteresis: on > 0.7, off < 0.3
    - name: "Living Room Ventilation Recommended"
      unique_id: living_room_ventilation_recommended
      default_entity_id: binary_sensor.living_room_ventilation_recommended
      icon: mdi:window-open-variant
      availability: >
        {{ has_value('sensor.living_room_absolute_humidity') and has_value('sensor.outdoor_absolute_humidity') }}
      state: >
        {% set d = states('sensor.living_room_absolute_humidity') | float
                 - states('sensor.outdoor_absolute_humidity') | float %}
        {{ d > 0.3 if is_state(this.entity_id, 'on') else d > 0.7 }}

