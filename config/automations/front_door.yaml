# =====================================================================
# Front door opener (Shelly Plus Uni O1 on Siedle system)
# Primary 100ms pulse: AUTO-OFF timer IN SHELLY (0.1 s) - see docs.
# This automation is only a safety net in case the timer on the
# device is disabled and the opener remains on.
# =====================================================================
- id: front_door_opener_failsafe_off
  alias: "Front door opener failsafe off"
  mode: single
  triggers:
    - trigger: state
      entity_id: switch.front_door_opener
      to: "on"
      for:
        seconds: 2
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.front_door_opener
    - action: notify.handy_sven
      data:
        title: "Türöffner-Failsafe ausgelöst"
        message: >
          O1 war länger als 2 s an - Auto-OFF-Timer im Shelly Plus Uni
          prüfen (soll: 0.1 s)!
