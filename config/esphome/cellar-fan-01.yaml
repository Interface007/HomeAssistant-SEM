###########################################################
#  Storage room (storage_room) - dew-point-driven ventilation.
#
#  The whole controller lives in includes/dewpoint_fan.yaml and is pulled
#  in the same way by laundry-fan-01.yaml. Only the values that set this
#  device apart from the others are listed here.
###########################################################

substitutions:
  name: "cellar-fan-01"
  friendly_name: "Kellerlüftung 01"
  static_ip: 192.168.2.41

  # Goes into the entity names - do not change any more, it would break
  # the HA entity IDs used in the dashboard and in templates/rooms.yaml.
  room_label: "Keller"

  # --- Source entities from Home Assistant ---
  src_outdoor_temp: sensor.outdoor_temperature
  src_outdoor_hum: sensor.outdoor_humidity
  src_indoor_temp: sensor.storage_room_temperature
  src_indoor_hum: sensor.storage_room_humidity

  # --- ESP32-S3-Zero pins (GPIO0/GPIO3 = strapping, GPIO19/20 = USB,
  #     GPIO21 = RGB LED) ---
  pin_fan_pwm: GPIO2
  pin_fan_tacho: GPIO4
  pin_onewire: GPIO6

packages:
  controller: !include ./includes/dewpoint_fan.yaml
