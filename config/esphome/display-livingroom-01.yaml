spi:
  clk_pin: 13
  mosi_pin: 14

display:
  - platform: waveshare_epaper
    model: 7.50inv2alt
    id: epaperdisplay
    cs_pin: 15
    dc_pin: 27
    busy_pin: 25
    reset_pin: 26
    reset_duration: 20ms
    update_interval: 15min

    lambda: |-
      // Ensure each frame starts from a clean white canvas.
      it.fill(COLOR_OFF);

      static const char* TAG = "ePaperLambda";
      auto my_tools = semTools(it, id(materialdesign_icons_tiny), id(openSansBold_font_small));

      const int canvas_width = 800;
      const int margin = 14;
      const int gutter = 10;

      auto split_csv = [](const std::string &csv) -> std::vector<std::string> {
        std::vector<std::string> parts;
        std::size_t start = 0;
        while (start <= csv.size()) {
          std::size_t end = csv.find(';', start);
          parts.push_back(semTools::extract_and_trim(csv, start, end));
          if (end == std::string::npos) {
            break;
          }
          start = end + 1;
        }
        return parts;
      };

      auto valid_text = [](const std::string &value) -> bool {
        return !value.empty() && value != "unknown" && value != "unavailable" && value != "None";
      };

      auto parse_number = [&](std::string value, float fallback) -> float {
        if (!valid_text(value)) {
          return fallback;
        }
        for (char &ch : value) {
          if (ch == ',') {
            ch = '.';
          }
        }
        return atof(value.c_str());
      };

      auto weather_icon = [](const std::string &state) -> const char * {
        if (state == "cloudy") return "\U000F0590";
        if (state == "exceptional" || state == "cloudy-alert") return "\U000F0F2F";
        if (state == "fog") return "\U000F0591";
        if (state == "hail") return "\U000F0592";
        if (state == "hazy") return "\U000F0F30";
        if (state == "hurricane") return "\U000F0898";
        if (state == "lightning") return "\U000F0593";
        if (state == "lightning-rainy") return "\U000F067E";
        if (state == "night" || state == "clear-night") return "\U000F0594";
        if (state == "night-partly-cloudy") return "\U000F0F31";
        if (state == "partly-cloudy" || state == "partlycloudy") return "\U000F0595";
        if (state == "partly-lightning") return "\U000F0F32";
        if (state == "partly-rainy") return "\U000F0F33";
        if (state == "partly-snowy") return "\U000F0F34";
        if (state == "partly-snowy-rainy") return "\U000F0F35";
        if (state == "pouring") return "\U000F0596";
        if (state == "rainy") return "\U000F0597";
        if (state == "snowy") return "\U000F0598";
        if (state == "snowy-heavy") return "\U000F0F36";
        if (state == "snowy-rainy") return "\U000F067F";
        if (state == "sunny") return "\U000F0599";
        if (state == "sunny-alert") return "\U000F0F37";
        if (state == "sunny-off") return "\U000F14E4";
        if (state == "tornado") return "\U000F0F38";
        if (state == "windy") return "\U000F059D";
        if (state == "windy-variant") return "\U000F059E";
        ESP_LOGI(TAG, "invalid weather cloud state: %s", state.c_str());
        return "\U000F0590";
      };

      auto short_day = [](const std::string &day) -> const char * {
        if (day == "Mon") return "Mo";
        if (day == "Tue") return "Di";
        if (day == "Wed") return "Mi";
        if (day == "Thu") return "Do";
        if (day == "Fri") return "Fr";
        if (day == "Sat") return "Sa";
        if (day == "Sun") return "So";
        ESP_LOGI(TAG, "invalid day state: %s", day.c_str());
        return "--";
      };

      auto condition_label = [](std::string value) -> std::string {
        if (value == "clear-night") return "Klare Nacht";
        if (value == "partly-cloudy" || value == "partlycloudy") return "Teilweise wolkig";
        if (value == "sunny") return "Sonnig";
        if (value == "rainy") return "Regen";
        if (value == "pouring") return "Starker Regen";
        if (value == "cloudy") return "Wolkig";
        if (value == "fog") return "Nebel";
        if (value == "windy") return "Windig";
        if (value == "lightning") return "Gewitter";
        if (value == "lightning-rainy") return "Gewitterregen";
        if (value == "snowy") return "Schnee";
        for (char &ch : value) {
          if (ch == '-') {
            ch = ' ';
          }
        }
        ESP_LOGI(TAG, "unknown weather condition state: %s", value.c_str());
        return value;
      };

      auto draw_card = [&](int x, int y, int w, int h, const char *title) {
        it.rectangle(x, y, w, h);
        it.printf(x + 14, y + 22, id(openSansBold_font), TextAlign::BASELINE_LEFT, "%s", title);
      };

      std::string weather_actual_raw = id(epaper_weather_actual).has_state() ? id(epaper_weather_actual).state : "";
      std::vector<std::string> weather_actual = split_csv(weather_actual_raw);

      std::string current_condition = "cloudy";
      if (weather_actual.size() > 0 && valid_text(weather_actual[0])) {
        current_condition = weather_actual[0];
      }

      std::string inside_temp = id(living_room_temperature).has_state() ? id(living_room_temperature).state : "--";
      std::string inside_humidity = id(living_room_humidity).has_state() ? id(living_room_humidity).state : "--";

      std::string outside_temp = id(outdoor_temperature).has_state() ? id(outdoor_temperature).state : "--";
      if ("--" == outside_temp && weather_actual.size() > 1 && valid_text(weather_actual[1])) {
        ESP_LOGI(TAG, "unknown garden temperature: %s", outside_temp.c_str());
        outside_temp = weather_actual[1];
      }

      std::string outside_humidity = id(outdoor_humidity).has_state() ? id(outdoor_humidity).state : "--";
      if ("--" == outside_humidity && weather_actual.size() > 2 && valid_text(weather_actual[2])) {
        ESP_LOGI(TAG, "unknown garden humidity: %s", outside_humidity.c_str());
        outside_humidity = weather_actual[2];
      }

      std::string pressure = weather_actual.size() > 3 && valid_text(weather_actual[3]) ? weather_actual[3] : "--";
      std::string wind = weather_actual.size() > 4 && valid_text(weather_actual[4]) ? weather_actual[4] : "--";

      std::string bathroom_temp = id(bathroom_temperature).has_state() ? id(bathroom_temperature).state : "--";
      std::string lea_temp = id(lea_room_temperature).has_state() ? id(lea_room_temperature).state : "--";

      float temp_out = parse_number(outside_temp, 0.0f);

      // NEW: Delta of absolute humidity (indoor - outdoor) comes precomputed from HA
      // (sensor.epaper_humidity_delta). Positive = more humid indoors.
      char humidity_delta_buffer[16];
      if (id(humidity_delta).has_state()) {
        snprintf(humidity_delta_buffer, sizeof(humidity_delta_buffer), "%+.1f", id(humidity_delta).state);
      } else {
        snprintf(humidity_delta_buffer, sizeof(humidity_delta_buffer), "--");
      }

      const char *lea_window_icon = id(lea_room_window).state ? "\U000F081C" : "\U000F081B";
      const char *lea_window_text = id(lea_room_window).state ? "Fenster offen" : "Fenster zu";

      // NEW: Ventilation recommendation directly from HA (with hysteresis, correct sign)
      const char *vent_icon = id(vent_recommended).state ? "\U000F0974" : "\U000F0975";
      const char *vent_text = id(vent_recommended).state ? "Lueften sinnvoll" : "Drinnen trockener";

      // NEW: Mold-risk status instead of Aurora
      std::string mold_state = id(mold_alert).has_state() ? id(mold_alert).state : "unknown";
      bool mold_ok = (mold_state == "OK");
      const char *mold_icon = mold_ok ? "\U000F05E0" : "\U000F0026";
      std::string mold_text = mold_ok ? "Schimmel: OK" : ("Schimmel: " + mold_state);

      std::string dryer_text = id(dryer_operation_state).has_state() ? id(dryer_operation_state).state : "Unbekannt";

      auto now = id(time_homeassistant).now();

      const int header_x = margin;
      const int header_y = 12;
      const int header_w = canvas_width - (margin * 2);
      const int header_h = 140;
      const int header_divider_x = header_x + 450;

      const int card_y = 164;
      const int card_h = 118;
      const int card_w = (canvas_width - (margin * 2) - (gutter * 3)) / 4;
      const int card1_x = margin;
      const int card2_x = card1_x + card_w + gutter;
      const int card3_x = card2_x + card_w + gutter;
      const int card4_x = card3_x + card_w + gutter;

      const int bottom_y = 302;
      const int bottom_h = 128;
      const int forecast_x = margin;
      const int forecast_w = 512;
      const int utility_x = forecast_x + forecast_w + gutter;
      const int utility_w = canvas_width - margin - utility_x;

      it.rectangle(header_x, header_y, header_w, header_h);
      it.line(header_divider_x, header_y + 14, header_divider_x, header_y + header_h - 14);

      it.printf(header_x + 22, header_y + 26, id(openSansBold_font), TextAlign::BASELINE_LEFT, "Wetter jetzt");
      it.printf(header_x + 20, header_y + 105, id(materialdesign_icons_80), TextAlign::BASELINE_LEFT, "%s", weather_icon(current_condition));

      // position of temperature right aligned to the icon
      auto pox = 122;
      if (temp_out < 10.0f) {
        pox = 142;
      }

      it.printf(header_x + pox, header_y + 96, id(temperature_font), TextAlign::BASELINE_LEFT, "%s", outside_temp.c_str());
      it.printf(header_x + 245, header_y + 96, id(temperature_font), TextAlign::BASELINE_LEFT, "°C");

      std::string condition_text = condition_label(current_condition);
      it.printf(header_x + 22, header_y + 132, id(openSansBold_font), TextAlign::BASELINE_LEFT, "%s", condition_text.c_str());

      it.printf(header_x + 319, header_y + 72, id(materialdesign_icons_35), TextAlign::BASELINE_LEFT, "\U000F058E");
      it.printf(header_x + 359, header_y + 72, id(openSansBold_font), TextAlign::BASELINE_LEFT, "%s%%", outside_humidity.c_str());
      it.printf(header_x + 319, header_y + 108, id(materialdesign_icons_35), TextAlign::BASELINE_LEFT, "\U000F059D");
      it.printf(header_x + 359, header_y + 108, id(openSansBold_font), TextAlign::BASELINE_LEFT, "%s km/h", wind.c_str());

      it.strftime(header_divider_x + 20, header_y + 42, id(weekDay_font), TextAlign::BASELINE_LEFT, "%A", now);
      it.strftime(header_divider_x + 20, header_y + 92, id(date_font), TextAlign::BASELINE_LEFT, "%d.%m.%y", now);
      it.strftime(header_divider_x + 20, header_y + 130, id(openSansBold_font), TextAlign::BASELINE_LEFT, "%H:%M", now);

      it.printf(header_divider_x + 175, header_y + 130, id(materialdesign_icons_35), TextAlign::BASELINE_LEFT, "%s", vent_icon);
      it.printf(header_divider_x + 212, header_y + 130, id(openSansBold_font), TextAlign::BASELINE_LEFT, "%s g/m3", humidity_delta_buffer);

      draw_card(card1_x, card_y, card_w, card_h, "Wohnzimmer");
      it.printf(card1_x + 14, card_y + 52, id(materialdesign_icons_35), TextAlign::BASELINE_LEFT, "\U000F050F");
      it.printf(card1_x + 54, card_y + 52, id(openSansBold_font), TextAlign::BASELINE_LEFT, "%s °C", inside_temp.c_str());
      it.printf(card1_x + 14, card_y + 82, id(materialdesign_icons_35), TextAlign::BASELINE_LEFT, "\U000F058E");
      it.printf(card1_x + 54, card_y + 82, id(openSansBold_font), TextAlign::BASELINE_LEFT, "%s %%", inside_humidity.c_str());
      it.printf(card1_x + 14, card_y + 108, id(materialdesign_icons_35), TextAlign::BASELINE_LEFT, "\U000F10C2");

      draw_card(card2_x, card_y, card_w, card_h, "Bad");
      const char *bath_window1_icon = id(bathroom_window).state ? "\U000F081C": "\U000F081B";
      const char *bath_window1_text = id(bathroom_window).state ? "Fenster offen" : "Fenster zu";
      std::string bathroom_humidity_text = id(bathroom_humidity).has_state() ? id(bathroom_humidity).state : "--";
      it.printf(card2_x +  14, card_y + 72, id(materialdesign_icons_60), TextAlign::BASELINE_LEFT, "\U000F09A0");
      it.printf(card2_x + 100, card_y + 56, id(openSansBold_font), TextAlign::BASELINE_LEFT, "%s °C", bathroom_temp.c_str());
      it.printf(card2_x +  80, card_y + 82, id(materialdesign_icons_35), TextAlign::BASELINE_LEFT, "\U000F058E");
      it.printf(card2_x + 100, card_y + 82, id(openSansBold_font), TextAlign::BASELINE_LEFT, "%s %%", bathroom_humidity_text.c_str());
      it.printf(card2_x +  14, card_y + 108, id(materialdesign_icons_35), TextAlign::BASELINE_LEFT, "%s", bath_window1_icon);
      it.printf(card2_x +  54, card_y + 108, id(openSansBold_font_small), TextAlign::BASELINE_LEFT, "%s", bath_window1_text);

      draw_card(card3_x, card_y, card_w, card_h, "Lea");
      it.printf(card3_x + 14, card_y + 72, id(materialdesign_icons_60), TextAlign::BASELINE_LEFT, "\U000F156F");
      it.printf(card3_x + 92, card_y + 56, id(openSansBold_font), TextAlign::BASELINE_LEFT, "%s °C", lea_temp.c_str());
      it.printf(card3_x + 14, card_y + 108, id(materialdesign_icons_35), TextAlign::BASELINE_LEFT, "%s", lea_window_icon);
      it.printf(card3_x + 54, card_y + 108, id(openSansBold_font_small), TextAlign::BASELINE_LEFT, "%s", lea_window_text);

      draw_card(card4_x, card_y, card_w, card_h, "Hausstatus");
      it.printf(card4_x + 14, card_y + 49, id(materialdesign_icons_30), TextAlign::BASELINE_LEFT, "%s", vent_icon);
      it.printf(card4_x + 54, card_y + 49, id(openSansBold_font_small), TextAlign::BASELINE_LEFT, "%s", vent_text);
      it.printf(card4_x + 14, card_y + 78, id(materialdesign_icons_30), TextAlign::BASELINE_LEFT, "\U000F0917");
      it.printf(card4_x + 54, card_y + 78, id(openSansBold_font_small), TextAlign::BASELINE_LEFT, "%s", dryer_text.c_str());
      it.printf(card4_x + 14, card_y + 107, id(materialdesign_icons_30), TextAlign::BASELINE_LEFT, "%s", mold_icon);
      it.printf(card4_x + 54, card_y + 107, id(openSansBold_font_small), TextAlign::BASELINE_LEFT, "%s", mold_text.c_str());

      it.rectangle(forecast_x, bottom_y, forecast_w, bottom_h);
      it.printf(forecast_x + 14, bottom_y + 22, id(openSansBold_font), TextAlign::BASELINE_LEFT, "5-Tage-Ausblick");

      std::string forecast_raw = id(epaper_weather_forecast).has_state() ? id(epaper_weather_forecast).state : "";
      std::vector<std::string> forecast_parts = split_csv(forecast_raw);
      for (int i = 0; i < 5; i++) {
        int block_x = forecast_x + 18 + (i * 98);
        int label_y = bottom_y + 52;
        if (forecast_parts.size() >= (i * 4 + 4)) {
          std::string day = forecast_parts[i * 4 + 0];
          std::string icon_state = forecast_parts[i * 4 + 1];
          std::string high = forecast_parts[i * 4 + 2];
          std::string low = forecast_parts[i * 4 + 3];
          it.printf(block_x, label_y, id(openSansBold_font), TextAlign::BASELINE_LEFT, "%s", short_day(day));
          it.printf(block_x + 6, label_y + 34, id(materialdesign_icons_32), TextAlign::BASELINE_LEFT, "%s", weather_icon(icon_state));
          it.printf(block_x, label_y + 65, id(openSansBold_font_small), TextAlign::BASELINE_LEFT, "%s / %s", high.c_str(), low.c_str());
        } else {
          it.printf(block_x, label_y + 34, id(openSansBold_font_small), TextAlign::BASELINE_LEFT, "--");
        }
        if (i < 4) {
          it.line(block_x + 74, bottom_y + 36, block_x + 74, bottom_y + bottom_h - 12);
        }
      }

      it.rectangle(utility_x, bottom_y, utility_w, bottom_h);
      it.printf(utility_x + 14, bottom_y + 22, id(openSansBold_font), TextAlign::BASELINE_LEFT, "Verbrauch");
      it.printf(utility_x + 14, bottom_y + 65, id(materialdesign_icons_35), TextAlign::BASELINE_LEFT, "\U000F1B29");
      my_tools.RenderDiagram(id(water_meter_history), utility_x + 52, bottom_y + 70, utility_w - 68, 28);
      it.printf(utility_x + 14, bottom_y + 113, id(materialdesign_icons_35), TextAlign::BASELINE_LEFT, "\U000F1904");
      my_tools.RenderDiagram(id(power_history), utility_x + 52, bottom_y + 118, utility_w - 68, 28);

      it.line(margin, 438, canvas_width - margin, 438);
      if (id(ip_address).has_state()) {
        it.printf(margin, 462, id(openSansBold_font_small), TextAlign::BASELINE_LEFT, "IP %s", id(ip_address).state.c_str());
      }

      if (id(wifisignal).has_state()) {
        const char *wifi_icon = "\U000F092B";
        auto wifi_value = id(wifisignal).state;
        if (wifi_value >= -50) {
          wifi_icon = "\U000F0928";
        } else if (wifi_value >= -60) {
          wifi_icon = "\U000F0925";
        } else if (wifi_value >= -67) {
          wifi_icon = "\U000F0922";
        } else if (wifi_value >= -70) {
          wifi_icon = "\U000F091F";
        }
        it.printf(208, 462, id(materialdesign_icons_32), TextAlign::BASELINE_LEFT, "%s", wifi_icon);
        it.printf(244, 462, id(openSansBold_font_small), TextAlign::BASELINE_LEFT, "%0.0f dBm", wifi_value);
      }

      it.printf(
          360, 462, id(openSansBold_font_small), TextAlign::BASELINE_LEFT,
          "Build %c%c%c%c-%02d-%02d %02d:%02d",
          __DATE__[7], __DATE__[8], __DATE__[9], __DATE__[10],
          ([]() {
              const char *m = __DATE__;
              if      (m[0] == 'J' && m[1] == 'a') return 1;
              else if (m[0] == 'F') return 2;
              else if (m[0] == 'M' && m[2] == 'r') return 3;
              else if (m[0] == 'A' && m[1] == 'p') return 4;
              else if (m[0] == 'M' && m[2] == 'y') return 5;
              else if (m[0] == 'J' && m[2] == 'n') return 6;
              else if (m[0] == 'J' && m[2] == 'l') return 7;
              else if (m[0] == 'A' && m[1] == 'u') return 8;
              else if (m[0] == 'S') return 9;
              else if (m[0] == 'O') return 10;
              else if (m[0] == 'N') return 11;
              else if (m[0] == 'D') return 12;
              else return 0;
          })(),
          atoi(&__DATE__[4]),
          atoi(&__TIME__[0]),
          atoi(&__TIME__[3])
      );

      // Battery row: windows (Shelly Blu) + water-leak sensors
      int battery_x = 594;
      int battery_y = 444;
      battery_x += 28; my_tools.BatterySymbol(id(bathroom_window_battery),        battery_x, battery_y, "bf");
      battery_x += 28; my_tools.BatterySymbol(id(lea_room_window_battery),        battery_x, battery_y, "lf");
      battery_x += 28; my_tools.BatterySymbol(id(kitchen_waterleak_battery),      battery_x, battery_y, "ks");
      battery_x += 28; my_tools.BatterySymbol(id(laundry_room_waterleak_battery),      battery_x, battery_y, "wr");
      battery_x += 28; my_tools.BatterySymbol(id(living_room_waterleak_battery),   battery_x, battery_y, "aq");
      battery_x += 28; my_tools.BatterySymbol(id(bathroom_waterleak_battery),  battery_x, battery_y, "bo");
      battery_x += 28; my_tools.BatterySymbol(id(toilet_waterleak_battery),       battery_x, battery_y, "wc");

# --- Sensors ------------------------------------------------------------------
sensor:
  - platform: uptime
    id: uptime_sensor
    update_interval: 60s
    on_raw_value:
      then:
        - text_sensor.template.publish:
            id: uptime_human
            state: !lambda |-
              int seconds = round(id(uptime_sensor).get_raw_state());
              int days = seconds / (24 * 3600);
              seconds = seconds % (24 * 3600);
              int hours = seconds / 3600;
              seconds = seconds % 3600;
              int minutes = seconds /  60;
              seconds = seconds % 60;
              return (
                (days ? String(days) + ":" : "000:") +
                (hours ? String(hours) + ":" : "00:") +
                (minutes ? String(minutes) + ":" : "00:") +
                (String(seconds) + "")
              ).c_str();
  - platform: wifi_signal
    name: "WiFi Signal Sensor"
    id: wifisignal
    update_interval: 60s
  # TODO: water meter not installed yet (AI on the Edge)
  - platform: homeassistant
    id: watermeter_value
    name: "Water Statistic"
    entity_id: sensor.watermeter_value
  # NEW: Delta absolute humidity (indoor - outdoor) from HA, positive = more humid indoors
  - platform: homeassistant
    id: humidity_delta
    entity_id: sensor.epaper_humidity_delta
    internal: true

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${name} IP Address"
      id: ip_address
    bssid:
      name: ESP Connected BSSID
      id: wifi_bssid
  - platform: template
    id: uptime_human
    icon: mdi:clock-start
  - platform: homeassistant
