# =====================================================================
# Automations: air quality / air purifier
#       follow naming conventions; verify fan entity after Miio setup.
# =====================================================================
- id: air_purifier_pause_on_open_window
  alias: "Air purifier pause on open window"
  triggers:
    - trigger: state
      entity_id: binary_sensor.bedroom_window_north_contact
      to: "on"
      for: "00:02:00"
  actions:
    - action: fan.turn_off
      target:
        entity_id: fan.bedroom_xiaomi_airfilter_01

- id: air_purifier_resume_on_closed_window
  alias: "Air purifier resume on closed window"
  triggers:
    - trigger: state
      entity_id: binary_sensor.bedroom_window_north_contact
      to: "off"
      for: "00:05:00"
  actions:
    - action: fan.turn_on
      target:
        entity_id: fan.bedroom_xiaomi_airfilter_01
