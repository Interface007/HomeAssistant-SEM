# =====================================================================
# Energy counters for the Energy Dashboard (Riemann integral over power).
# Only needed for the battery - solar yield comes natively from
# sensor.terrace_anker_solix_ertrag_gesamt (lifetime counter).
# =====================================================================
- platform: integration
  name: solarbank_01_charge_energy
  unique_id: solarbank_01_charge_energy
  source: sensor.anker_solarbank_01_charge_power  # nach Anwendung von renames.csv
  method: left
  unit_prefix: k
  unit_time: h

- platform: integration
  name: solarbank_01_discharge_energy
  unique_id: solarbank_01_discharge_energy
  source: sensor.anker_solarbank_01_discharge_power  # nach Anwendung von renames.csv
  method: left
  unit_prefix: k
  unit_time: h

# =====================================================================
# Statistics sensors: rolling 24h average of wall-surface humidity.
# Basis for mold_risk (mold requires sustained >= 80%,
# short peaks, e.g. after showering, should not trigger alerts).
# =====================================================================
- platform: statistics
  name: "living_room_wall_surface_humidity_24h"
  unique_id: living_room_wall_surface_humidity_24h
  entity_id: sensor.living_room_wall_surface_humidity
  state_characteristic: mean
  max_age:
    hours: 24
  sampling_size: 1500

- platform: statistics
  name: "bedroom_wall_surface_humidity_24h"
