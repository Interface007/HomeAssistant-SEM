# =====================================================================
# display-livingroom-01 — 7.5" ePaper status display (living room)
# Adapted to the new strategy (HomeAssistant 2.0):
#   - ALL calculations (abs. humidity, ventilation, mold) run in HA;
#     ESP32 now only displays ready-made values
#   - Entity IDs migrated to new epaper_* feeders and convention names
#   - Aurora line replaced by mold-risk status (epaper_mold_alert)
#   - Old ventilation logic was inverted (out-in instead of in-out) -> fixed,
#     source now binary_sensor.living_room_ventilation_recommended
# TODO (see 03 - ePaper reactivation and calculations.md):
#   - Water meter / power history: sources are still missing (sensor_history replacement pending)
# =====================================================================
substitutions:
  name: "display-livingroom-01"
  friendly_name: Wohnzimmer Display 01
  static_ip: 192.168.2.48

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.5.0
  name_add_mac_suffix: false
  includes:
    - ./semTools.h

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

ota: !include ./includes/ota.yaml
wifi: !include ./includes/wifi_common.yaml
captive_portal:
web_server: !include ./includes/web.yaml

api:
  on_client_connected:
    then:
      - delay: 20s
      - component.update: epaperdisplay
  encryption:
    key: !secret api_enc_key

