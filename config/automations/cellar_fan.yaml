# =====================================================================
# Automations: cellar ventilation (ESPHome cellar-fan-01)
#
# Night-time reduction of the fan speed. The controller itself runs
# entirely on the ESP; all that happens here is setting the upper limit
# that the controller applies to the result of its dew-point ramp.
#
# 0 % stops the fan completely for the duration of the window.
# 100 % releases it - the controller then decides on its own.
#
# The value survives a reboot of the ESP. So if HA goes down the last
# limit stays in place instead of silently lifting itself.
# =====================================================================

- id: cellar_fan_night_limit_on
  alias: "Cellar fan: night speed limit on"
  description: >
    Throttles the cellar fan to 40 % at night. At that speed the Arctic
    P12 is practically inaudible but keeps dehumidifying.
  triggers:
    - trigger: time
      at: "22:00:00"
  actions:
    - action: number.set_value
      target:
        entity_id: number.storage_room_fan01_maximale_lufterleistung
      data:
        value: 40

- id: cellar_fan_night_limit_off
  alias: "Cellar fan: night speed limit off"
  description: Releases full speed again in the morning.
  triggers:
    - trigger: time
      at: "10:00:00"
  actions:
    - action: number.set_value
      target:
        entity_id: number.storage_room_fan01_maximale_lufterleistung
      data:
        value: 100

# After an HA restart, re-apply the limit that matches the time of day.
# Without this it would sit at the old value until the next scheduled
# point, whenever HA restarts across one of the two trigger times.
- id: cellar_fan_night_limit_sync
  alias: "Cellar fan: sync night speed limit after restart"
  triggers:
    - trigger: homeassistant
      event: start
  actions:
    - action: number.set_value
      target:
        entity_id: number.storage_room_fan01_maximale_lufterleistung
      data:
        value: >
          {{ 40 if today_at('22:00') <= now() or now() < today_at('06:00')
             else 100 }}
