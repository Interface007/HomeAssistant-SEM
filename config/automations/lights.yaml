# =====================================================================
# Light control via Aqara Opple switch (Zigbee2MQTT).
#
# Supports both common publish styles:
# 1) zigbee2mqtt/<device>/action  -> payload: button_1_single
# 2) zigbee2mqtt/<device>         -> JSON with field "action"
#
# If your payload differs, only adjust the action lists.
# =====================================================================
- id: aqaraopple_switch_01_button_actions
  alias: "Aqara Opple switch 01 button actions"
  description: "Button 1 toggles Shelly Mini G3, button 2 toggles light.ikea_light_03."
  mode: single
  triggers:
    - trigger: mqtt
      topic: zigbee2mqtt/aqaraopple_switch_01/action
    - trigger: mqtt
      topic: zigbee2mqtt/aqaraopple_switch_01
  variables:
    action_payload: >
      {% if trigger.topic == 'zigbee2mqtt/aqaraopple_switch_01/action' %}
        {{ trigger.payload }}
      {% else %}
        {{ trigger.payload_json.action | default('', true) }}
      {% endif %}
    btn1_actions:
      - button_1_single
      - single_1
      - 1_single
      - button_1
    btn2_actions:
      - button_2_single
      - single_2
      - 2_single
      - button_2
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ action_payload in btn1_actions }}"
          sequence:
            - action: switch.toggle
              target:
                entity_id: switch.living_room_shelly_minig3_01
        - conditions:
            - condition: template
              value_template: "{{ action_payload in btn2_actions }}"
          sequence:
            - action: light.toggle
              target:
                entity_id: light.ikea_light_03

- id: enforce_ikea_lights_power_on_behavior_on
  alias: "Enforce IKEA lights power-on behavior ON"
  description: >
    Sets startUpOnOff to "on" so the panels come back on after a mains
    outage.

    Deliberately no longer triggers on the select entities themselves.
    That was a feedback loop: the action changes exactly the states that
    form the trigger, so every write kicked off the next one. And since
    the selects sit at "unknown" and never reach the target value, the
    natural stopping point was missing too.
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: homeassistant
      event: start
    # After a Zigbee2MQTT crash the bridge comes back up without HA
    # restarting - re-apply in that case as well.
    - trigger: state
      entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
      to: "on"
  actions:
    # Without the wait the writes run into "Delivery failed": at startup
    # the routes to the ceiling panels are not established yet.
    - delay: "00:01:00"
    - repeat:
        for_each:
          - select.ikea_light_01_power_on_behavior
          - select.ikea_light_02_power_on_behavior
          - select.ikea_light_03_power_on_behavior
        sequence:
          # if/then rather than condition: a bare condition would abort
          # the whole repeat loop, not just this one iteration.
          - if:
              - condition: template
                value_template: "{{ states(repeat.item) != 'on' }}"
            then:
              - action: select.select_option
                continue_on_error: true
                target:
                  entity_id: "{{ repeat.item }}"
                data:
                  option: "on"

- id: enforce_shelly_minig3_on_after_power_restore
  alias: "Enforce Shelly Mini G3 ON after power restore"
  description: "Turns switch.living_room_shelly_minig3_01 on when Home Assistant starts or the device comes back online."
  mode: restart
  triggers:
    - trigger: homeassistant
      event: start
    - trigger: state
      entity_id: switch.living_room_shelly_minig3_01
      from: "unavailable"
    - trigger: state
      entity_id: switch.living_room_shelly_minig3_01
      from: "unknown"
  actions:
    - delay: "00:00:02"
    - action: switch.turn_on
      continue_on_error: true
      target:
        entity_id: switch.living_room_shelly_minig3_01
