# =====================================================================
# Water consumption history for ePaper display
# 
# This automation collects daily consumption data (last 14 days)
# and stores it as a CSV string for the RenderDiagram feature.
# 
# Flow:
# 1. Every day at 23:55, utility_meter.water_daily is read
# 2. The value is appended to the existing list (in input_text.water_meter_history)
# 3. Old values (older than 14 days) are removed
# 4. The result is stored as `;`-separated values
# =====================================================================

- id: water_meter_daily_update
  alias: "Wasserzähler: Tägliche Historie aktualisieren"
  description: "Speichert täglich den Wasserverbrauch für die 14-Tage-Anzeige"
  mode: single
  triggers:
    # Update daily at 23:55 (after the last consumption event of the day)
    - trigger: time
      at: "23:55:00"
    # On system startup
    - trigger: homeassistant
      event: start
  actions:
    - action: input_text.set_value
      entity_id: input_text.water_meter_history
      data:
        value: >
          {%- set current_history = states('input_text.water_meter_history') | default('', true) -%}
          {%- set daily_usage = states('sensor.water_daily') | default('0', true) | float(0) -%}
          {%- if daily_usage > 0 -%}
            {%- set parts = current_history.split(';') | list -%}
            {%- if parts | count > 0 and parts[0] != '' -%}
              {%- set updated = (parts[:13] | list) -%}
              {%- set updated_str = ([daily_usage | int] + updated) | join(';') -%}
              {{- updated_str -}}
            {%- else -%}
              {{- daily_usage | int -}}
            {%- endif -%}
          {%- else -%}
            {{- current_history -}}
          {%- endif -%}

